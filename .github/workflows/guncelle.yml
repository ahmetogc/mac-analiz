name: Veriyi guncelle
on:
  schedule:
    - cron: "0 5,15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 veri.py
      - run: |
          git config user.name "veri-botu"
          git config user.email "veri-botu@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Veri guncellendi"
          git push
